<!-- register.component.html -->
<div class="auth-page">
  <div class="auth-card card">
    <div class="auth-header">
      <img class="auth-logo" src="assets/oold_navbar_logo_red.png" alt="OOLD" />
      <p>{{ 'auth.register' | translate }}</p>
    </div>

    <div class="alert alert-error" *ngIf="error">{{ error }}</div>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="form-group">
        <label class="form-label">{{ 'auth.name' | translate }}</label>
        <input formControlName="name" type="text" class="form-control"
               [class.is-invalid]="form.get('name')?.invalid && form.get('name')?.touched" />
      </div>

      <div class="form-group">
        <label class="form-label">{{ 'auth.email' | translate }}</label>
        <input formControlName="email" type="email" class="form-control"
               [class.is-invalid]="form.get('email')?.invalid && form.get('email')?.touched" />
      </div>

      <div class="form-group">
        <label class="form-label">{{ 'auth.password' | translate }}</label>
        <input formControlName="password" type="password" class="form-control" />
        <span class="form-error" *ngIf="form.get('password')?.invalid && form.get('password')?.touched">
          {{ 'errors.weakPassword' | translate }}
        </span>
      </div>

      <div class="form-group">
        <label class="form-label">{{ 'auth.confirmPassword' | translate }}</label>
        <input formControlName="confirm" type="password" class="form-control"
               [class.is-invalid]="form.errors?.['mismatch'] && form.get('confirm')?.touched" />
        <span class="form-error" *ngIf="form.errors?.['mismatch'] && form.get('confirm')?.touched">
          {{ 'errors.passwordMismatch' | translate }}
        </span>
      </div>

      <button type="submit" class="btn btn-primary btn-lg w-full" [disabled]="loading">
        {{ loading ? ('common.loading' | translate) : ('auth.register' | translate) }}
      </button>
    </form>

    <p class="auth-switch">
      {{ 'auth.hasAccount' | translate }}
      <a routerLink="/auth/login">{{ 'auth.loginHere' | translate }}</a>
    </p>
  </div>
</div>
