<!-- reset-password.component.html -->
<div class="auth-page">
  <div class="auth-card card">
    <div class="auth-header">
      <h1>🔒 {{ 'auth.resetPassword' | translate }}</h1>
    </div>
    <div class="alert alert-success" *ngIf="success">{{ success }}</div>
    <div class="alert alert-error"   *ngIf="error">{{ error }}</div>
    <form [formGroup]="form" (ngSubmit)="submit()" *ngIf="!success">
      <div class="form-group">
        <label class="form-label">{{ 'auth.newPassword' | translate }}</label>
        <input formControlName="password" type="password" class="form-control" />
        <span class="form-error" *ngIf="form.get('password')?.invalid && form.get('password')?.touched">
          {{ 'errors.weakPassword' | translate }}
        </span>
      </div>
      <div class="form-group">
        <label class="form-label">{{ 'auth.confirmPassword' | translate }}</label>
        <input formControlName="confirm" type="password" class="form-control" />
        <span class="form-error" *ngIf="form.errors?.['mismatch'] && form.get('confirm')?.touched">
          {{ 'errors.passwordMismatch' | translate }}
        </span>
      </div>
      <button type="submit" class="btn btn-primary btn-lg w-full" [disabled]="loading">
        {{ loading ? ('common.loading' | translate) : ('auth.resetPassword' | translate) }}
      </button>
    </form>
  </div>
</div>
