<!-- login.component.html -->
<div class="auth-page">
  <div class="auth-card card">
    <div class="auth-header">
      <img class="auth-logo" src="assets/oold_navbar_logo_red.png" alt="OOLD" />
      <p>{{ 'auth.login' | translate }}</p>
    </div>

    <div class="alert alert-error" *ngIf="error">{{ error }}</div>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="form-group">
        <label class="form-label">{{ 'auth.email' | translate }}</label>
        <input formControlName="email" type="email" class="form-control"
               [class.is-invalid]="form.get('email')?.invalid && form.get('email')?.touched" />
        <span class="form-error" *ngIf="form.get('email')?.invalid && form.get('email')?.touched">
          {{ 'errors.invalidEmail' | translate }}
        </span>
      </div>

      <div class="form-group">
        <label class="form-label">{{ 'auth.password' | translate }}</label>
        <input formControlName="password" type="password" class="form-control" />
      </div>

      <a routerLink="/auth/forgot-password" class="forgot-link">{{ 'auth.forgotPassword' | translate }}</a>

      <button type="submit" class="btn btn-primary btn-lg w-full" [disabled]="loading">
        {{ loading ? ('common.loading' | translate) : ('auth.login' | translate) }}
      </button>
    </form>

    <p class="auth-switch">
      {{ 'auth.noAccount' | translate }}
      <a routerLink="/auth/register">{{ 'auth.registerHere' | translate }}</a>
    </p>
  </div>
</div>
