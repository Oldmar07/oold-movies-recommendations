<!-- forgot-password.component.html -->
<div class="auth-page">
  <div class="auth-card card">
    <div class="auth-header">
      <h1>🔑 {{ 'auth.forgotPassword' | translate }}</h1>
    </div>
    <div class="alert alert-success" *ngIf="success">{{ success }}</div>
    <div class="alert alert-error"   *ngIf="error">{{ error }}</div>
    <form [formGroup]="form" (ngSubmit)="submit()" *ngIf="!success">
      <div class="form-group">
        <label class="form-label">{{ 'auth.email' | translate }}</label>
        <input formControlName="email" type="email" class="form-control" />
      </div>
      <button type="submit" class="btn btn-primary btn-lg w-full" [disabled]="loading">
        {{ loading ? ('common.loading' | translate) : ('auth.sendReset' | translate) }}
      </button>
    </form>
    <p class="auth-switch"><a routerLink="/auth/login">{{ 'auth.backToLogin' | translate }}</a></p>
  </div>
</div>
